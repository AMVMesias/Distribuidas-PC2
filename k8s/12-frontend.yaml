apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nexo-park
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: nexo-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /es, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /es, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nexo-park
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 3000, targetPort: http }
