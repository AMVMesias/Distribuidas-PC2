apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: nexo-park
data:
  rabbitmq.conf: |
    vm_memory_high_watermark.absolute = 384MiB
    disk_free_limit.absolute = 100MB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: nexo-park
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: nexo-park
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: parking-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: parking-secrets, key: RABBITMQ_PASSWORD } }
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "+S 1:1 +A 1"
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf, readOnly: true }
          readinessProbe:
            tcpSocket: { port: amqp }
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: rabbitmq-data }
        - name: config
          configMap: { name: rabbitmq-config }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: nexo-park
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
