apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: nexo-park
spec:
  replicas: 1
  selector:
    matchLabels: { app: kong }
  template:
    metadata:
      labels: { app: kong }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kong
          image: kong:3.9.1
          ports:
            - { name: proxy, containerPort: 8000 }
          env:
            - { name: KONG_DATABASE, value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG, value: /kong/declarative/kong.yml }
            - { name: KONG_ADMIN_LISTEN, value: "off" }
            - { name: KONG_PROXY_ACCESS_LOG, value: /dev/stdout }
            - { name: KONG_PROXY_ERROR_LOG, value: /dev/stderr }
            - { name: KONG_NGINX_WORKER_PROCESSES, value: "1" }
          volumeMounts:
            - { name: config, mountPath: /kong/declarative, readOnly: true }
          readinessProbe:
            exec: { command: [kong, health] }
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: [kong, health] }
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: nexo-park
spec:
  selector: { app: kong }
  ports:
    - { name: http, port: 8000, targetPort: proxy }
