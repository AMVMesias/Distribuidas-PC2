apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-audit
  namespace: nexo-park
spec:
  replicas: 1
  selector:
    matchLabels: { app: ms-audit }
  template:
    metadata:
      labels: { app: ms-audit }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ms-audit
          image: nexo-audit:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: parking-config }
            - secretRef: { name: parking-secrets }
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: auditoria }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: parking-secrets, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: parking-secrets, key: POSTGRES_PASSWORD } }
          startupProbe:
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
